name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -e  # 에러 발생 시 즉시 중단
            
            cd ~/FashionFever
            git pull origin main

            cd ./backend
            npm install
            npm run build
            pm2 reload backend

            cd ../frontend
            npm install
            npm run build
            pm2 reload frontend
